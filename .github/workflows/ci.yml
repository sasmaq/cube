name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The checks run in parallel. Each one checks out the code and installs dependencies
# through the shared setup action in .github/actions/setup.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx tsc -b

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # On GitHub Actions, Vitest also writes a test report to the job summary
      # and annotates failing tests on the changed lines.
      - run: npm run test:coverage
      - name: Report coverage
        run: |
          {
            echo "## Coverage"
            echo
            echo "| File | Statements | Branches | Functions | Lines |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            jq -r --arg root "$PWD/" '
              to_entries[]
              | "| \(if .key == "total" then "**All files**" else (.key | ltrimstr($root)) end) | \(.value.statements.pct)% | \(.value.branches.pct)% | \(.value.functions.pct)% | \(.value.lines.pct)% |"
            ' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Bundle only; the Type check job covers the tsc half of `npm run build`.
      - run: npx vite build
      - name: Report bundle size
        run: |
          {
            echo "## Bundle size"
            echo
            echo "| File | Size | Gzip |"
            echo "| --- | ---: | ---: |"
            for f in dist/assets/*; do
              size=$(wc -c < "$f")
              gzip=$(gzip -c "$f" | wc -c)
              awk -v f="$(basename "$f")" -v s="$size" -v g="$gzip" 'BEGIN { printf "| %s | %.1f kB | %.1f kB |\n", f, s / 1000, g / 1000 }'
            done
          } >> "$GITHUB_STEP_SUMMARY"
