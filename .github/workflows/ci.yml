name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The checks run in parallel. Each one checks out the code and installs dependencies
# through the shared setup action in .github/actions/setup.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx tsc -b

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # On GitHub Actions, Vitest also writes a test report to the job summary
      # and annotates failing tests on the changed lines.
      - run: npm run test:coverage
      # The total leads the job summary, with the per-file table folded under it, and is also
      # posted as a notice so it shows on the run's page without opening the summary.
      - name: Report coverage
        run: |
          total=$(jq -r '.total | "\(.statements.pct)% statements · \(.branches.pct)% branches · \(.functions.pct)% functions · \(.lines.pct)% lines"' coverage/coverage-summary.json)
          echo "::notice title=Total coverage::$total"
          {
            echo "## Coverage"
            echo
            echo "**Total:** $total"
            echo
            echo "<details><summary>By file</summary>"
            echo
            echo "| File | Statements | Branches | Functions | Lines |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            jq -r --arg root "$PWD/" '
              to_entries[]
              | select(.key != "total")
              | "| \(.key | ltrimstr($root)) | \(.value.statements.pct)% | \(.value.branches.pct)% | \(.value.functions.pct)% | \(.value.lines.pct)% |"
            ' coverage/coverage-summary.json
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # Cypress runs in its bundled Electron. The runners have no GPU, so Chromium needs this
  # switch to draw WebGL in software (SwiftShader) instead of refusing to create a context.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      ELECTRON_EXTRA_LAUNCH_ARGS: --enable-unsafe-swiftshader
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cypress: true
      - run: npm run test:integration
      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      ELECTRON_EXTRA_LAUNCH_ARGS: --enable-unsafe-swiftshader
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cypress: true
      # Builds the app, serves it with `vite preview` and runs the specs against it.
      - run: npm run test:e2e
      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Bundle only; the Type check job covers the tsc half of `npm run build`.
      - run: npx vite build
      - name: Report bundle size
        run: |
          {
            echo "## Bundle size"
            echo
            echo "| File | Size | Gzip |"
            echo "| --- | ---: | ---: |"
            for f in dist/assets/*; do
              size=$(wc -c < "$f")
              gzip=$(gzip -c "$f" | wc -c)
              awk -v f="$(basename "$f")" -v s="$size" -v g="$gzip" 'BEGIN { printf "| %s | %.1f kB | %.1f kB |\n", f, s / 1000, g / 1000 }'
            done
          } >> "$GITHUB_STEP_SUMMARY"
